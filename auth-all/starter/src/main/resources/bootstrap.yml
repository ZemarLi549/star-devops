auth:
  nacos:
    server-addr: ${CONFIG_NACOS_SERVER_ADDR:192.168.32.128:8848}
    username: ${CONFIG_NACOS_USERNAME:nacos}
    password: ${CONFIG_NACOS_PASSWORD:nacos}
    namespace: ${CONFIG_NACOS_NAMESPACE:st-observable}

spring:
  main:
    allow-circular-references: true
  application:
    name: auth
  cloud:
    nacos:
      config:
        server-addr: ${auth.nacos.server-addr}
        username: ${auth.nacos.username}
        password: ${auth.nacos.password}
        file-extension: yaml
        namespace: ${auth.nacos.namespace}
        extension-configs[0]:
          group: ${AUTH_NACOS_SERVER_GROUP:auth-all}
          data-id: application.yaml
          refresh: true
        enabled: true
        refresh-enabled: true
      discovery:
        server-addr: ${auth.nacos.server-addr}
        username: ${auth.nacos.username}
        password: ${auth.nacos.password}
        namespace: ${auth.nacos.namespace}
        enabled: true