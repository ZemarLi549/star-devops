# 生产 Nginx 配置样例
# 适用日期：2026-08-15
#
# 说明：
# 1. 宿主 cpo-basic-app-front 托管在 /
# 2. AI 人效微前端 cpo-ai-productivity-front 托管在 /ai-productivity/
# 3. AI 人效后端 cpo-ai-productivity-service 走 /productivity-api/
# 4. 其他 auth / 业务代理按现网继续保留

upstream cpo_ai_productivity_backend {
    server 127.0.0.1:9060;
    keepalive 32;
}

server {
    listen 80;
    server_name portal.example.com;

    # 宿主前端
    root /data/apps/star-devops/cpo-basic-app-front/dist;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 宿主首页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI 人效微前端静态资源
    location /ai-productivity/ {
        alias /data/apps/star-devops/cpo-ai-productivity-front/dist/;
        index index.html;
        try_files $uri $uri/ /ai-productivity/index.html;
    }

    # AI 人效后端 API
    location /productivity-api/ {
        proxy_pass http://cpo_ai_productivity_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # auth-all 示例，按现网调整
    location /auth/ {
        proxy_pass http://127.0.0.1:9004/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
